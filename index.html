<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBIT LOG · 我的博客</title>
<style>
  :root{
    --bg:#000; --panel:#0a0a0c; --line:#1d1d22;
    --text:#f5f5f7; --dim:#9a9aa3; --accent:#fc3d21;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.75;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  /* ---------- nav ---------- */
  header{
    position:fixed; inset:0 0 auto 0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 30px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .logo{font-weight:800; letter-spacing:3px; font-size:17px; cursor:pointer; user-select:none}
  .logo i{display:inline-block; width:9px; height:9px; border-radius:50%;
    background:var(--accent); margin-right:10px; box-shadow:0 0 12px var(--accent)}
  nav a{
    color:var(--dim); text-decoration:none; margin-left:26px; font-size:14px;
    letter-spacing:1px; transition:color .3s; cursor:pointer;
  }
  nav a:hover, nav a.on{color:#fff}
  /* ---------- views ---------- */
  .view{display:none}
  .view.active{display:block; animation:viewIn .7s cubic-bezier(.22,.8,.3,1) both}
  @keyframes viewIn{from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none}}
  /* ---------- hero ---------- */
  .hero{
    position:relative; min-height:92vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:120px 24px 70px; overflow:hidden;
  }
  #stars{position:absolute; inset:0; width:100%; height:100%}
  .hero .inner{position:relative; z-index:2; max-width:820px}
  .kicker{
    color:var(--accent); letter-spacing:5px; font-size:12px; font-weight:700;
    text-transform:uppercase; margin-bottom:26px;
    animation:fadeDown 1s .15s both;
  }
  .hero h1{
    font-size:clamp(38px,6.4vw,68px); font-weight:800; line-height:1.18; letter-spacing:1px;
    animation:fadeDown 1s .3s both;
  }
  .hero p{
    color:var(--dim); font-size:clamp(15px,2vw,18px); margin:26px auto 40px; max-width:560px;
    animation:fadeDown 1s .45s both;
  }
  .cta{
    display:inline-block; padding:13px 34px; border:1px solid #fff; border-radius:999px;
    color:#fff; text-decoration:none; font-size:15px; letter-spacing:1px; cursor:pointer;
    transition:all .35s; animation:fadeDown 1s .6s both; background:transparent;
  }
  .cta:hover{background:#fff; color:#000; transform:translateY(-2px)}
  @keyframes fadeDown{from{opacity:0; transform:translateY(-18px)} to{opacity:1; transform:none}}
  .scrollhint{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    color:var(--dim); font-size:20px; animation:bob 2.2s ease-in-out infinite; z-index:2;
  }
  @keyframes bob{0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,9px)}}
  /* ---------- sections ---------- */
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px}
  section{padding:76px 0}
  .sec-title{
    font-size:13px; letter-spacing:4px; color:var(--accent);
    text-transform:uppercase; font-weight:700; margin-bottom:10px;
  }
  .sec-head{font-size:30px; font-weight:800; margin-bottom:38px; letter-spacing:.5px}
  /* reveal on scroll */
  .rv{opacity:0; transform:translateY(34px); transition:opacity .9s cubic-bezier(.22,.8,.3,1), transform .9s cubic-bezier(.22,.8,.3,1)}
  .rv.in{opacity:1; transform:none}
  /* ---------- post cards ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; cursor:pointer;
    transition:transform .45s cubic-bezier(.22,.8,.3,1), border-color .45s, box-shadow .45s;
  }
  .card:hover{transform:translateY(-8px); border-color:#3a3a44; box-shadow:0 24px 50px rgba(0,0,0,.55)}
  .cover{height:150px; position:relative; overflow:hidden}
  .cover::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 78% 22%, rgba(255,255,255,.5) 0 2px, transparent 3px),
               radial-gradient(circle at 22% 64%, rgba(255,255,255,.35) 0 1.5px, transparent 2.5px),
               radial-gradient(circle at 55% 38%, rgba(255,255,255,.28) 0 1.5px, transparent 2.5px);
  }
  .cover .tag{
    position:absolute; left:16px; bottom:14px; z-index:2;
    font-size:11px; letter-spacing:2px; padding:4px 11px; border-radius:999px;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.25); color:#fff;
  }
  .card .body{padding:22px}
  .date{color:var(--dim); font-size:12.5px; letter-spacing:1px; margin-bottom:8px}
  .card h3{font-size:19px; line-height:1.45; margin-bottom:9px; font-weight:700}
  .card p{color:var(--dim); font-size:14.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .empty{color:var(--dim); text-align:center; padding:50px 0; font-size:15px}
  /* ---------- about ---------- */
  .about-box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:38px;
    display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap;
  }
  .avatar{
    width:84px; height:84px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 32% 30%, #3a4a75, #10182e 70%);
    display:flex; align-items:center; justify-content:center; font-size:34px;
    border:1px solid #2c3857;
  }
  .about-box p{color:var(--dim); max-width:640px; font-size:15.5px}
  .about-box h3{font-size:21px; margin-bottom:8px}
  /* ---------- article ---------- */
  .article{max-width:760px; margin:0 auto; padding:130px 24px 90px}
  .back{
    color:var(--dim); background:none; border:none; font-size:15px; cursor:pointer;
    margin-bottom:34px; letter-spacing:.5px; transition:color .3s; padding:0;
  }
  .back:hover{color:#fff}
  .article h1{font-size:clamp(28px,4.6vw,42px); line-height:1.3; font-weight:800; margin:12px 0 16px}
  .article .meta{color:var(--dim); font-size:13.5px; letter-spacing:1px; padding-bottom:26px; border-bottom:1px solid var(--line); margin-bottom:34px}
  .article .content p{margin-bottom:22px; font-size:17px; color:#e9e9ee; animation:fadeDown .8s both}
  /* ---------- editor ---------- */
  .editor{max-width:760px; margin:0 auto; padding:130px 24px 90px}
  .editor h1{font-size:30px; font-weight:800; margin-bottom:8px}
  .editor .sub{color:var(--dim); font-size:14.5px; margin-bottom:30px}
  .editor label{display:block; font-size:13px; letter-spacing:2px; color:var(--dim); margin:22px 0 8px; text-transform:uppercase}
  .editor input[type=text], .editor textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-size:16px; padding:14px 16px; font-family:inherit; outline:none;
    transition:border-color .3s;
  }
  .editor input:focus, .editor textarea:focus{border-color:#4a4a58}
  .editor textarea{min-height:220px; resize:vertical; line-height:1.8}
  .row{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap}
  .btn{
    padding:12px 28px; border-radius:999px; border:1px solid #fff; background:#fff; color:#000;
    font-size:15px; cursor:pointer; transition:all .3s; font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent; color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.1)}
  .mine{margin-top:48px}
  .mine h2{font-size:19px; margin-bottom:16px}
  .mine-item{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:14px 18px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px;
    background:var(--panel);
  }
  .mine-item span{font-size:15px}
  .del{
    background:none; border:1px solid #3d3d47; color:var(--dim); border-radius:999px;
    padding:6px 16px; cursor:pointer; font-size:13px; transition:all .3s; flex:none; font-family:inherit;
  }
  .del:hover{border-color:var(--accent); color:var(--accent)}
  .note{color:var(--dim); font-size:13px; margin-top:18px}
  /* ---------- gear / language ---------- */
  #gear{
    position:fixed; right:22px; bottom:22px; z-index:80;
    width:54px; height:54px; border-radius:50%;
    background:rgba(18,18,22,.85); border:1px solid #2c2c35; color:#d9d9e0;
    font-size:24px; cursor:pointer; backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    transition:transform .5s cubic-bezier(.22,.8,.3,1), border-color .3s;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #gear:hover{transform:rotate(70deg); border-color:#4a4a58}
  #langPanel{
    position:fixed; right:22px; bottom:88px; z-index:80; width:210px;
    background:rgba(14,14,18,.94); border:1px solid #2c2c35; border-radius:16px;
    padding:16px; backdrop-filter:blur(14px);
    opacity:0; transform:translateY(14px) scale(.97); pointer-events:none;
    transition:all .35s cubic-bezier(.22,.8,.3,1); box-shadow:0 24px 50px rgba(0,0,0,.6);
  }
  #langPanel.open{opacity:1; transform:none; pointer-events:auto}
  #langPanel .lp-title{font-size:12px; letter-spacing:2.5px; color:var(--dim); text-transform:uppercase; margin-bottom:12px}
  .lang-opt{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    background:none; border:none; color:var(--text); font-size:15.5px; padding:10px 8px;
    cursor:pointer; border-radius:8px; font-family:inherit; text-align:left; transition:background .25s;
  }
  .lang-opt:hover{background:rgba(255,255,255,.07)}
  .lang-opt .ck{color:var(--accent); opacity:0; font-weight:700}
  .lang-opt.sel .ck{opacity:1}
  footer{
    border-top:1px solid var(--line); padding:34px 24px 96px; text-align:center;
    color:#5c5c66; font-size:13.5px; letter-spacing:.5px;
  }
  @media (max-width:640px){
    header{padding:14px 18px}
    nav a{margin-left:16px; font-size:13px}
    section{padding:56px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important; transition-duration:.01ms!important}
  }
</style>
</head>

<header>

      </div>
    </section>
  </div>
  <footer data-i18n="footer">© 2026 myvpsroot.top · 用好奇心驱动</footer>
</div>

<!-- ============ ARTICLE ============ -->
<div class="view" id="view-article">
  <div class="article">
    <button class="back" onclick="showView('home')" data-i18n="back">← 返回</button>
    <div class="date" id="artDate"></div>
    <h1 id="artTitle"></h1>
    <div class="meta" id="artMeta"></div>
    <div class="content" id="artBody"></div>
  </div>
  <footer data-i18n="footer">© 2026 myvpsroot.top · 用好奇心驱动</footer>
</div>

<!-- ============ GEAR / LANGUAGE ============ -->
<button id="gear" title="Language / 语言" onclick="toggleLang(event)">⚙️</button>
<div id="langPanel">
  <div class="lp-title" data-i18n="lang_title">语言 · Language</div>
  <button class="lang-opt" data-lang="zh" onclick="setLang('zh')">中文 <span class="ck">✓</span></button>
  <button class="lang-opt" data-lang="en" onclick="setLang('en')">English <span class="ck">✓</span></button>
  <button class="lang-opt" data-lang="fr" onclick="setLang('fr')">Français <span class="ck">✓</span></button>
</div>

/* ================= state ================= */
let lang = localStorage.getItem("orbit_lang") || "zh";
let postsData = null; // posts loaded from posts-index.json; falls back to embedded SAMPLES

function pick(v){
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[lang] || v.zh || v.en || v.fr || "";
}
function normalize(p){
  const t = p.t ? (p.t[lang] || p.t.zh) : null;
  const title = t ? t.title : pick(p.title);
  const body  = t ? t.body  : pick(p.body);
  const tag   = t ? t.tag   : pick(p.tag);
  const ex    = t ? t.ex    : (body.split("\n").filter(s => s.trim())[0] || "").slice(0, 60);
  return { id: p.id, date: p.date,
           grad: p.grad || "linear-gradient(135deg,#23232c,#4a4a58 60%,#101014)",
           tag: tag || I18N[lang].default_tag, title: title, ex: ex, body: body };
}
function currentPosts(){
  const src = postsData || SAMPLES;
  return src.map(normalize).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function loadPosts(){
  fetch("posts-index.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(list => { if (Array.isArray(list) && list.length) postsData = list; renderPosts(); })
    .catch(() => renderPosts());
}

/* ================= render ================= */
function renderPosts(){
  const grid = document.getElementById("postGrid");
  if (!grid) return;
  const posts = currentPosts();
  grid.innerHTML = "";
  document.getElementById("postEmpty").style.display = posts.length ? "none" : "block";
  posts.forEach((p, i) => {
    const el = document.createElement("article");
    el.className = "card rv";
    el.style.transitionDelay = (i % 3) * 0.08 + "s";
    el.innerHTML = '<div class="cover" style="background:' + p.grad + '"><span class="tag"></span></div>' +
      '<div class="body"><div class="date"></div><h3></h3><p></p></div>';
    el.querySelector(".tag").textContent = p.tag;
    el.querySelector(".date").textContent = p.date;
    el.querySelector("h3").textContent = p.title;
    el.querySelector("p").textContent = p.ex;
    el.onclick = () => openArticle(p.id);
    grid.appendChild(el);
  });
  observeRv();
}
function openArticle(id){
  const p = currentPosts().find(x => x.id === id);
  if (!p) return;
  document.getElementById("artDate").textContent = p.date + " · " + p.tag;
  document.getElementById("artTitle").textContent = p.title;
  const words = p.body.replace(/\s/g, "").length;
  document.getElementById("artMeta").textContent = "ORBIT LOG · " + Math.max(1, Math.round(words / 300)) + " " + I18N[lang].min_read;
  const body = document.getElementById("artBody");
  body.innerHTML = "";
  p.body.split(/\n\s*\n|\n/).filter(s => s.trim()).forEach((para, i) => {
    const el = document.createElement("p");
    el.textContent = para.trim();
    el.style.animationDelay = (i * 0.12) + "s";
    body.appendChild(el);
  });
  showView("article");
  window.scrollTo({ top: 0 });
}

/* ================= views ================= */
function showView(name){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  if (name === "home") renderPosts();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function goPosts(){ showView("home"); setTimeout(() => document.getElementById("posts").scrollIntoView({ behavior: "smooth" }), 80); }
function goAbout(){ showView("home"); setTimeout(() => document.getElementById("about").scrollIntoView({ behavior: "smooth" }), 80); }

/* ================= language ================= */
function applyLang(){
  const d = I18N[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (d[k]) el.textContent = d[k];
  });
  document.querySelectorAll(".lang-opt").forEach(b => b.classList.toggle("sel", b.getAttribute("data-lang") === lang));
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  renderPosts();
}
function setLang(l){
  lang = l;
  localStorage.setItem("orbit_lang", l);
  applyLang();
  document.getElementById("langPanel").classList.remove("open");
}
function toggleLang(e){
  e.stopPropagation();
  document.getElementById("langPanel").classList.toggle("open");
}
document.addEventListener("click", e => {
  const p = document.getElementById("langPanel");
  if (p.classList.contains("open") && !p.contains(e.target)) p.classList.remove("open");
});

/* ================= reveal on scroll ================= */
let rvObs;
function observeRv(){
  if (rvObs) rvObs.disconnect();
  rvObs = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("in"); rvObs.unobserve(en.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll(".rv").forEach(el => rvObs.observe(el));
}

/* ================= starfield ================= */
(function(){
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  let W, H, stars = [];
  function size(){
    W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight;
    stars = Array.from({ length: Math.min(160, W / 8) }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3, p: Math.random() * Math.PI * 2,
      s: 0.008 + Math.random() * 0.02, d: Math.random() * 0.06
    }));
  }
  size(); window.addEventListener("resize", size);
  (function draw(){
    ctx.clearRect(0, 0, W, H);
    stars.forEach(st => {
      st.p += st.s; st.y += st.d; if (st.y > H) st.y = 0;
      const a = 0.25 + Math.abs(Math.sin(st.p)) * 0.75;
      ctx.globalAlpha = a; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  })();
})();

/* ================= init ================= */
applyLang();
loadPosts();
</script>
